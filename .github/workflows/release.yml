name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cache the ~200MB vendor/ tree across runs so we only download HLAE +
      # ffmpeg once per pinned-version. Cache key includes setup_vendor.py
      # because that's where the URLs live — bumping the pin invalidates
      # the cache automatically.
      - name: Cache vendor/ (HLAE + ffmpeg)
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('setup_vendor.py') }}

      - name: Download HLAE + ffmpeg into vendor/
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: python setup_vendor.py
        # ~150MB HLAE zip + ~80MB ffmpeg essentials zip → 5–8 min on cold cache.

      - name: Verify vendor/ is complete
        run: python setup_vendor.py --check

      # Round 4c Fase 2 — Node + editor bundle pra escalabilidade user
      # final. setup_node.py baixa Node 20 LTS portable Win x64 (~30MB).
      # setup_editor.py copia editor Remotion + node_modules do sibling
      # repo `fragreel` clonado no step abaixo. Cache de Node por pinned
      # version (NODE_VERSION em setup_node.py).
      - name: Cache vendor/node/ (Node 20 LTS portable)
        id: node-cache
        uses: actions/cache@v4
        with:
          path: vendor/node
          key: node-${{ runner.os }}-${{ hashFiles('setup_node.py') }}

      - name: Download Node portable into vendor/node/
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: python setup_node.py

      - name: Verify vendor/node/ is complete
        run: python setup_node.py --check

      # Editor (Remotion) — checkout do sibling repo `fragreel` numa pasta
      # adjacente ao client repo (mesma convention de dev mode pro
      # `_resolve_editor_dir` discovery), depois `npm ci` no editor pra
      # popular node_modules, depois copia pra vendor/editor/.
      # GitHub Actions checkout exige path DENTRO do GITHUB_WORKSPACE.
      # Antes tentamos `../fragreel` (Round 4c Fase 2 v1) — falhou:
      # "Repository path 'D:\a\fragreel-client\fragreel' is not under
      # 'D:\a\fragreel-client\fragreel-client'". Fix: subdir do workspace.
      - name: Checkout fragreel sibling repo (editor source)
        uses: actions/checkout@v4
        with:
          repository: mathieuanduze/fragreel
          path: fragreel-sibling
          ref: main
          fetch-depth: 1

      - name: Set up Node.js (for npm ci)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fragreel-sibling/editor/package-lock.json

      - name: npm ci no editor (pra popular node_modules)
        working-directory: fragreel-sibling/editor
        run: npm ci

      - name: Copy editor → vendor/editor/ pra bundling
        run: python setup_editor.py --source fragreel-sibling/editor --force

      - name: Verify vendor/editor/ is complete
        run: python setup_editor.py --check

      # Sprint J Etapa J.3 (29/04): cria vendor-editor.zip pra upload como
      # GitHub Release asset. Cliente final baixa esse zip em runtime via
      # setup_editor_download.py (Sprint J Etapa J.2) em vez de bundlar no
      # .exe (que era 80+ MB do total 362 MB do v0.5.0).
      #
      # CRÍTICO Bug #13 V2: zip DEVE preservar node_modules/*/dist (esses são
      # compiled JS de cada pacote npm — Remotion precisa deles em runtime).
      # Round 4c teve 36 fases pra resolver bug parecido — NÃO regredir.
      #
      # Strategy: usar Python inline com lógica path-aware (mesmo padrão de
      # setup_editor.py SKIP_DIRS path-aware do v0.4.5+). Garante semântica
      # consistente entre CI zip e copy_editor_to_vendor. Skip dirs SÓ no
      # top-level do editor (não recursive em node_modules).
      #
      # Histórico: tentamos 7z primeiro mas 7-Zip 26.x rejeitou syntax
      # -xr! ("Too short switch r!"). Python é portable + previsível.
      - name: Create vendor-editor.zip pra Sprint J runtime download
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          python -c "
          import os, sys, zipfile
          from pathlib import Path

          source = Path('vendor/editor')
          target = Path('vendor-editor.zip')

          # Path-aware skip (Bug #13 V2 fix lição):
          # - SKIP_ALWAYS: irrelevantes em qualquer lugar
          # - SKIP_TOPLEVEL_ONLY: só no root do editor, NUNCA em node_modules
          SKIP_ALWAYS = {'.git', '.next', '.vercel', '.turbo'}
          SKIP_TOPLEVEL_ONLY = {'dist', 'build', 'out'}

          source_str = str(source.resolve())
          n_files = 0
          remotion_cli_dist_found = False

          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=5) as zf:
              for root, dirs, files in os.walk(source):
                  rel = os.path.relpath(root, source).replace('\\\\', '/')
                  in_node_modules = '/node_modules/' in ('/' + rel + '/')

                  # Filter dirs IN PLACE pra os.walk skipar entrando neles
                  dirs[:] = [d for d in dirs if d not in SKIP_ALWAYS]
                  if not in_node_modules:
                      dirs[:] = [d for d in dirs if d not in SKIP_TOPLEVEL_ONLY]

                  for f in files:
                      abs_path = os.path.join(root, f)
                      rel_path = os.path.relpath(abs_path, source).replace('\\\\', '/')
                      zf.write(abs_path, rel_path)
                      n_files += 1
                      if 'node_modules/@remotion/cli/dist/index.js' in rel_path:
                          remotion_cli_dist_found = True

          size_mb = target.stat().st_size / 1024 / 1024
          print(f'vendor-editor.zip: {size_mb:.1f} MB ({n_files} files)')
          if not remotion_cli_dist_found:
              print('ERROR: Bug #13 V2 risk — @remotion/cli/dist/index.js NOT in zip!', file=sys.stderr)
              sys.exit(1)
          print('Bug #13 V2 sanity check: @remotion/cli/dist/index.js OK')
          "

      - name: Upload vendor-editor.zip artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vendor-editor
          path: vendor-editor.zip
          if-no-files-found: error
          retention-days: 30

      # Sobrescreve version.py com a tag que disparou o workflow (ou um
      # sentinel pra workflow_dispatch manual). O .exe final sempre carrega
      # a versão que o CI registrou — nunca o fallback de dev. Isso elimina
      # o passo manual de bumpar version.py antes de tagear.
      - name: Inject version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            cat > version.py <<EOF
          # Auto-gerado por .github/workflows/release.yml a partir da tag ${tag}.
          # NÃO editar — qualquer mudança aqui é sobrescrita no próximo build.
          __version__ = "${tag}"
          EOF
          else
            sha_short="$(git rev-parse --short HEAD)"
            cat > version.py <<EOF
          # Auto-gerado: build manual via workflow_dispatch (sem tag).
          __version__ = "v0.0.0-manual-${sha_short}"
          EOF
          fi
          echo "--- version.py ---"
          cat version.py
          echo "------------------"

      - name: Build .exe with PyInstaller
        run: pyinstaller --noconfirm --clean FragReel.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FragReel.exe")) {
            Write-Error "FragReel.exe not produced"
            exit 1
          }
          $exe = Get-Item dist\FragReel.exe
          $exe | Select-Object Name, Length, LastWriteTime
          # Sanity check post-bundle (Sprint J — 29/04):
          # - v0.4.x Fase 1: ~250MB (HLAE 200MB + ffmpeg 50MB bundled)
          # - v0.5.0 Fase 2: ~360MB (+ Node 30MB + editor 80MB bundled)
          # - v0.6.0 Sprint J: ~5-15MB (vendor downloaded em runtime)
          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          Write-Output "FragReel.exe size: $sizeMB MB"

          if ($exe.Length -gt 50MB) {
            Write-Warning "FragReel.exe > 50MB — Sprint J esperado ~5-15MB. vendor/ pode estar bundlado erroneamente?"
          }
          if ($exe.Length -lt 1MB) {
            Write-Error "FragReel.exe < 1MB — build incompleto"
            exit 1
          }

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: FragReel-unsigned
          path: dist/FragReel.exe
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # SignPath signing — uncomment after the project is approved.
  # Docs: https://about.signpath.io/documentation/build-system-integration/github
  # Required GitHub repo secrets:
  #   SIGNPATH_API_TOKEN
  # Required vars:
  #   SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
  # ─────────────────────────────────────────────────────────────────
  # sign:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Submit to SignPath
  #       uses: signpath/github-action-submit-signing-request@v1
  #       with:
  #         api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
  #         organization-id: ${{ vars.SIGNPATH_ORG_ID }}
  #         project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  #         signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
  #         github-artifact-id: ${{ needs.build.outputs.artifact-id }}
  #         wait-for-completion: true
  #         output-artifact-directory: signed

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FragReel-unsigned
          path: ./release

      # Sprint J Etapa J.3: download vendor-editor.zip artifact criado no
      # build job pra incluir como Release asset. Cliente final em runtime
      # vai baixar esse asset via setup_editor_download.py.
      - uses: actions/download-artifact@v4
        with:
          name: vendor-editor
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FragReel.exe
            release/vendor-editor.zip
          draft: false
          prerelease: false
          generate_release_notes: true
